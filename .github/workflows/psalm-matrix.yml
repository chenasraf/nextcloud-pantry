name: Static analysis

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: psalm-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  psalm:
    uses: chenasraf/workflows/.github/workflows/nextcloud-psalm.yml@nextcloud-latest
    secrets: inherit
    with:
      php-versions-min: "8.2"
      # The default filters cover **.php and psalm.xml; the stubs decide which
      # server internals resolve, so a change there moves the results too.
      path-filters: |
        - '**.php'
        - 'psalm.xml'
        - 'tests/stubs/**'

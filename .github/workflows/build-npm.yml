name: Build NPM

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: build-npm-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-npm:
    uses: chenasraf/workflows/.github/workflows/nextcloud-build-npm.yml@nextcloud-latest
    secrets: inherit
    with:
      # Runs whatever changed. A filtered-out job reports success, so a commit
      # touching nothing it watches would paint over the previous commit's red.
      path-filters: |
        - '**'

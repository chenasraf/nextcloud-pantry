name: PHPUnit MySQL

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: phpunit-mysql-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  phpunit-mysql:
    uses: chenasraf/workflows/.github/workflows/nextcloud-phpunit-mysql.yml@nextcloud-latest
    secrets: inherit
    with:
      # Runs whatever changed. A filtered-out job reports success, so a commit
      # touching nothing it watches would paint over the previous commit's red.
      path-filters: |
        - '**'

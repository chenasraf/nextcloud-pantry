pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{ts,vue}"
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true
    prettier:
      glob: "*.{scss,vue,ts,md}"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    prettier-json:
      glob: "*.json"
      exclude: "openapi.json"
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    php-cs-fixer:
      glob: "*.php"
      exclude: "/gen/"
      env:
        PHP_CS_FIXER_IGNORE_ENV: "1"
      # Psalm runs after the fixer rather than beside it: the fixer rewrites the
      # same files Psalm reads, and analysis covers the whole of lib/ regardless
      # of what is staged.
      run: make php-cs-fixer && make lint-ocp && make test && make psalm
      stage_fixed: true
    psalm:
      # The PHP files are covered above; these are the other inputs that decide
      # what Psalm reports.
      glob:
        - "psalm.xml"
        - "tests/stubs/*"
      run: make psalm
    openapi:
      glob:
        - "*Controller.php"
        - "lib/Capabilities.php"
        - "lib/ResponseDefinitions.php"
      run: make openapi && git add openapi.json
    lint-appinfo:
      glob: "appinfo/info.xml"
      run: make lint-appinfo
    lint-ocp:
      # The PHP files are covered above; these two move the answer without any
      # PHP changing — min-version is what symbols are checked against, and the
      # lockfile decides which OCP stubs they are checked in.
      glob:
        - "appinfo/info.xml"
        - "composer.lock"
      run: make lint-ocp
